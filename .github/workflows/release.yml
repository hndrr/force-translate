name: Release extension

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Prepare automatic release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/prepare-release.mjs
      - run: npm ci --ignore-scripts
        if: steps.release.outputs.exists == 'false'
      - run: npm test
        if: steps.release.outputs.exists == 'false'
      - run: npm run package
        if: steps.release.outputs.exists == 'false'
      - name: Publish GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/force-translate-*.zip \
            dist/force-translate-*.zip.sha256 \
            dist/release-checklist.md \
            --target "$RELEASE_COMMIT" \
            --title "Force Translate $RELEASE_TAG" \
            --generate-notes
      - name: Show packaging report
        if: steps.release.outputs.exists == 'false'
        run: cat dist/release-checklist.md >> "$GITHUB_STEP_SUMMARY"
