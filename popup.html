<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Force Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="title-row">
          <strong>Force Translate</strong>
          <span id="stateBadge" class="state-badge">待機</span>
        </div>
        <div id="siteLabel" class="site-label">ページを確認中…</div>
      </header>

      <section class="actions">
        <button id="translateButton" class="primary" type="button">このページを翻訳</button>
        <button id="restoreButton" type="button">原文に戻す</button>
      </section>

      <label class="toggle-row">
        <span>
          <span class="toggle-title">このサイトは自動翻訳</span>
          <span class="toggle-note">次回以降も自動で日本語化</span>
        </span>
        <input id="autoToggle" type="checkbox" role="switch" />
      </label>

      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="progressText" class="progress-text">翻訳モデルを準備中…</div>
      </div>

      <div id="message" class="message" aria-live="polite"></div>
      <footer>Alt + Shift + T でも翻訳を切り替えられます</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
